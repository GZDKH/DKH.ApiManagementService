syntax = "proto3";

package proto.api_management.api.ai_provider_crud.v1;

option csharp_namespace = "DKH.ApiManagementService.Contracts.ApiManagement.Api.AiProviderCrud.v1";

import "api_management/models/ai_provider/v1/ai_provider.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/wrappers.proto";
import "types/guid.proto";
import "types/pagination.proto";
import "types/pagination_metadata.proto";
import "types/soft_delete_filter.proto";

service AiProviderCrudService {
  rpc Create(CreateAiProviderRequest) returns (proto.api_management.models.ai_provider.v1.AiProviderModel);
  rpc Get(GetAiProviderRequest) returns (proto.api_management.models.ai_provider.v1.AiProviderModel);
  rpc List(ListAiProvidersRequest) returns (ListAiProvidersResponse);
  rpc Update(UpdateAiProviderRequest) returns (proto.api_management.models.ai_provider.v1.AiProviderModel);
  rpc Delete(DeleteAiProviderRequest) returns (google.protobuf.Empty);
  rpc Restore(RestoreAiProviderRequest) returns (proto.api_management.models.ai_provider.v1.AiProviderModel);
  rpc PermanentlyDelete(PermanentlyDeleteAiProviderRequest) returns (google.protobuf.Empty);

  // Internal service-to-service resolution of the active provider's runtime credentials for one
  // provider type, used by AI runtimes (e.g. AssistantService) while serving a merchant request.
  // Unlike List this exposes no admin surface: a single active provider, runtime fields only.
  rpc ResolveActiveProvider(ResolveActiveProviderRequest) returns (ResolveActiveProviderResponse);
}

message CreateAiProviderRequest {
  string name = 1;
  proto.api_management.models.ai_provider.v1.AiProviderType provider_type = 2;
  google.protobuf.StringValue display_name = 3;
  google.protobuf.StringValue base_url = 4;
  repeated string models = 5;
  google.protobuf.StringValue api_key_reference = 6;
  google.protobuf.Int32Value rate_limit_per_minute = 7;
  google.protobuf.Int32Value daily_quota = 8;
}

message GetAiProviderRequest {
  proto.platform.grpc.common.types.GuidValue id = 1;
}

message ListAiProvidersRequest {
  proto.platform.grpc.common.types.PaginationRequest pagination = 1;
  proto.api_management.models.ai_provider.v1.AiProviderType type_filter = 2;
  proto.api_management.models.ai_provider.v1.AiProviderStatus status_filter = 3;
  optional proto.platform.grpc.common.types.SoftDeleteFilter soft_delete_filter = 4;
}

message ListAiProvidersResponse {
  repeated proto.api_management.models.ai_provider.v1.AiProviderModel providers = 1;
  proto.platform.grpc.common.types.PaginationMetadata metadata = 2;
}

message UpdateAiProviderRequest {
  proto.platform.grpc.common.types.GuidValue id = 1;
  google.protobuf.StringValue name = 2;
  google.protobuf.StringValue display_name = 3;
  google.protobuf.StringValue base_url = 4;
  repeated string models = 5;
  google.protobuf.StringValue api_key_reference = 6;
  google.protobuf.Int32Value rate_limit_per_minute = 7;
  google.protobuf.Int32Value daily_quota = 8;
}

message DeleteAiProviderRequest {
  proto.platform.grpc.common.types.GuidValue id = 1;
}

message RestoreAiProviderRequest {
  proto.platform.grpc.common.types.GuidValue id = 1;
}

message PermanentlyDeleteAiProviderRequest {
  proto.platform.grpc.common.types.GuidValue id = 1;
}

message ResolveActiveProviderRequest {
  proto.api_management.models.ai_provider.v1.AiProviderType provider_type = 1;
}

message ResolveActiveProviderResponse {
  // Unset when no active provider is configured for the requested type.
  optional ResolvedAiProvider provider = 1;
}

// Runtime subset of AiProviderModel: only what an AI client needs to build a chat client.
// Deliberately omits id, status, quotas, audit fields and every other admin-listing field.
message ResolvedAiProvider {
  proto.api_management.models.ai_provider.v1.AiProviderType provider_type = 1;
  google.protobuf.StringValue base_url = 2;
  google.protobuf.StringValue api_key_reference = 3;
  repeated string models = 4;
}
