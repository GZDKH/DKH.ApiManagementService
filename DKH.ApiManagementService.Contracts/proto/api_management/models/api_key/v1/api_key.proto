syntax = "proto3";

package proto.api_management.models.api_key.v1;

option csharp_namespace = "DKH.ApiManagementService.Contracts.ApiManagement.Models.ApiKey.v1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/wrappers.proto";
import "types/guid.proto";

enum ApiKeyScope {
  API_KEY_SCOPE_UNSPECIFIED = 0;
  API_KEY_SCOPE_MCP = 1;
  API_KEY_SCOPE_WEBHOOK = 2;
  API_KEY_SCOPE_PARTNER = 3;
  API_KEY_SCOPE_STOREFRONT = 4;
  API_KEY_SCOPE_INTERNAL = 5;
}

enum ApiKeyStatus {
  API_KEY_STATUS_UNSPECIFIED = 0;
  API_KEY_STATUS_ACTIVE = 1;
  API_KEY_STATUS_REVOKED = 2;
  API_KEY_STATUS_EXPIRED = 3;
}

enum ApiKeyEnvironment {
  API_KEY_ENVIRONMENT_UNSPECIFIED = 0;
  API_KEY_ENVIRONMENT_SANDBOX = 1;
  API_KEY_ENVIRONMENT_PRODUCTION = 2;
}

enum ApiKeyRateLimitTier {
  API_KEY_RATE_LIMIT_TIER_UNSPECIFIED = 0;
  API_KEY_RATE_LIMIT_TIER_DEVELOPMENT = 1;
  API_KEY_RATE_LIMIT_TIER_STANDARD = 2;
  API_KEY_RATE_LIMIT_TIER_PROFESSIONAL = 3;
  API_KEY_RATE_LIMIT_TIER_ENTERPRISE = 4;
}

message ApiKeyModel {
  proto.platform.grpc.common.types.GuidValue id = 1;
  string name = 2;
  string key_prefix = 3;
  ApiKeyScope scope = 4;
  ApiKeyStatus status = 5;
  repeated string permissions = 6;
  google.protobuf.StringValue description = 7;
  google.protobuf.Timestamp expires_at = 8;
  google.protobuf.Timestamp last_used_at = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  proto.platform.grpc.common.types.GuidValue created_by = 12;
  proto.platform.grpc.common.types.GuidValue customer_id = 13;
  ApiKeyEnvironment environment = 14;
  ApiKeyRateLimitTier rate_limit_tier = 15;
  int32 rate_limit_requests_per_minute = 16;
  google.protobuf.Timestamp last_rotated_at = 17;
  int32 rotation_count = 18;
  google.protobuf.StringValue previous_key_prefix = 19;
  proto.platform.grpc.common.types.GuidValue storefront_id = 20;
}
