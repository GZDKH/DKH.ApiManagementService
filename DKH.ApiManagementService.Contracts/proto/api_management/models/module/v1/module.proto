syntax = "proto3";

package proto.api_management.models.module.v1;

option csharp_namespace = "DKH.ApiManagementService.Contracts.ApiManagement.Models.Module.v1";

// The execution kind of a component.
enum ModuleKind {
  MODULE_KIND_UNSPECIFIED = 0;
  MODULE_KIND_PLUGIN = 1;
  MODULE_KIND_SERVICE = 2;
}

// Runtime lifecycle state of a component within a deployment.
enum ModuleState {
  MODULE_STATE_UNSPECIFIED = 0;
  MODULE_STATE_DISCOVERED = 1;
  MODULE_STATE_INSTALLED = 2;
  MODULE_STATE_ENABLED = 3;
  MODULE_STATE_DISABLED = 4;
  MODULE_STATE_FAILED = 5;
}

// The kind of subject an entitlement applies to.
enum ModuleScopeKind {
  MODULE_SCOPE_KIND_UNSPECIFIED = 0;
  MODULE_SCOPE_KIND_DEPLOYMENT = 1;
  MODULE_SCOPE_KIND_TENANT = 2;
  MODULE_SCOPE_KIND_STOREFRONT = 3;
  MODULE_SCOPE_KIND_LICENSE = 4;
}

// Categorizes a problem found while resolving the module dependency graph.
enum ModuleResolutionProblemKind {
  MODULE_RESOLUTION_PROBLEM_KIND_UNSPECIFIED = 0;
  MODULE_RESOLUTION_PROBLEM_KIND_MISSING_COMPONENT = 1;
  MODULE_RESOLUTION_PROBLEM_KIND_MISSING_CAPABILITY = 2;
  MODULE_RESOLUTION_PROBLEM_KIND_VERSION_CONFLICT = 3;
  MODULE_RESOLUTION_PROBLEM_KIND_CYCLE = 4;
  MODULE_RESOLUTION_PROBLEM_KIND_UNENTITLED = 5;
}

// The subject of an entitlement check. value is empty for deployment scope.
message ModuleScope {
  ModuleScopeKind kind = 1;
  string value = 2;
}

// A localized text keyed by culture code (e.g. "en", "ru").
message LocalizedText {
  map<string, string> values = 1;
}

// A capability a component provides.
message ModuleCapability {
  string id = 1;
  string version = 2;
}

// A dependency on a capability, with an optional version range.
message ModuleDependency {
  string capability_id = 1;
  string version_range = 2;
}

// A component (a service or a plugin) in the catalog.
message ModuleComponentModel {
  string id = 1;
  ModuleKind kind = 2;
  LocalizedText name = 3;
  string version = 4;
  repeated ModuleCapability provides = 5;
  repeated ModuleDependency requires = 6;
  string requires_entitlement = 7;
  ModuleState state = 8;
  // Localized human-readable description from the component's manifest.
  LocalizedText description = 9;
  // Functional category from the manifest (e.g. "Commerce/Payments"); empty when unset.
  string category = 10;
}

// A sellable bundle of components.
message ModuleEditionModel {
  string id = 1;
  LocalizedText name = 2;
  repeated string component_ids = 3;
  string requires_entitlement = 4;
}

// The deployment-level runtime state of a component.
message ModuleStateModel {
  string module_id = 1;
  ModuleState state = 2;
  string version = 3;
}

// An entitlement record for a scope and module.
message ModuleEntitlementModel {
  ModuleScope scope = 1;
  string module_id = 2;
  bool granted = 3;
}

// A single problem found while resolving the dependency graph.
message ModuleResolutionProblem {
  ModuleResolutionProblemKind kind = 1;
  string component_id = 2;
  string detail = 3;
}

// The resolved activation order plus any problems found.
message ModuleDependencyGraphModel {
  repeated string ordered_component_ids = 1;
  repeated ModuleResolutionProblem problems = 2;
}
